<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تتبع اليد">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#020705">
<title>نظام تتبع اليد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#020705; --panel:rgba(4,18,12,.78); --line:rgba(0,255,156,.18); --line2:rgba(0,255,156,.38);
    --g:#00ff9c; --g2:#00c97a; --dim:#3f7a63; --txt:#c9ffe6; --red:#ff4d5e; --amber:#ffc23d;
    --ar:"IBM Plex Sans Arabic",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); color:var(--txt); font-family:var(--ar); overflow:hidden; }
  body {
    display:flex; flex-direction:column; gap:10px; height:100dvh;
    padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px);
  }
  #rain { position:fixed; inset:0; z-index:0; opacity:.22; pointer-events:none; }
  body > *:not(#rain) { position:relative; z-index:1; }
  .mono { font-family:var(--mono); direction:ltr; unicode-bidi:isolate; }

  /* الشريط العلوي */
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:17px; color:var(--g); text-shadow:0 0 12px rgba(0,255,156,.45); }
  .brand i { width:10px; height:10px; border-radius:2px; background:var(--g); box-shadow:0 0 10px var(--g); animation:pulse 2s infinite; }
  .pills { display:flex; gap:6px; }
  .pill { display:flex; align-items:center; gap:5px; font-size:11px; padding:4px 8px; border:1px solid var(--line); border-radius:99px; background:var(--panel); color:var(--dim); }
  .pill b { width:7px; height:7px; border-radius:50%; background:var(--red); box-shadow:0 0 6px var(--red); }
  .pill.wait b { background:var(--amber); box-shadow:0 0 6px var(--amber); animation:pulse 1s infinite; }
  .pill.ok b { background:var(--g); box-shadow:0 0 6px var(--g); }
  .pill.ok { color:var(--txt); }
  button.pill { font:inherit; font-size:11px; cursor:pointer; }
  button.pill:not(.ok) b { background:var(--dim); box-shadow:none; }

  /* الكاميرا */
  #cam { flex:1; min-height:0; position:relative; border-radius:18px; overflow:hidden; background:#000; border:1px solid var(--line2);
         box-shadow:0 0 0 1px rgba(0,0,0,.6) inset, 0 0 30px rgba(0,255,156,.08); }
  #cam video, #cam canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #cam.mirror video, #cam.mirror canvas { transform:scaleX(-1); }
  #cam .scan { position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); }
  #cam .sweep { position:absolute; left:0; right:0; height:70px; top:-70px; pointer-events:none;
    background:linear-gradient(180deg, transparent, rgba(0,255,156,.10), transparent); animation:sweep 3.2s linear infinite; }
  .corner { position:absolute; width:26px; height:26px; border:2px solid var(--g); opacity:.7; pointer-events:none; }
  .c1 { top:10px; right:10px; border-left:0; border-bottom:0; border-radius:0 8px 0 0; }
  .c2 { top:10px; left:10px; border-right:0; border-bottom:0; border-radius:8px 0 0 0; }
  .c3 { bottom:10px; right:10px; border-left:0; border-top:0; border-radius:0 0 8px 0; }
  .c4 { bottom:10px; left:10px; border-right:0; border-top:0; border-radius:0 0 0 8px; }
  .hud-top { position:absolute; top:14px; right:44px; left:44px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
  #lock { font-size:12px; font-weight:600; color:var(--g); padding:3px 10px; border-radius:99px; background:rgba(0,0,0,.55); border:1px solid var(--line2); opacity:0; transition:opacity .2s; }
  #lock.on { opacity:1; }
  #fps { font-size:11px; color:var(--dim); background:rgba(0,0,0,.55); padding:3px 8px; border-radius:99px; }
  .hud-bottom { position:absolute; bottom:14px; right:44px; left:44px; display:flex; justify-content:space-between; align-items:flex-end; pointer-events:none; }
  #count { font-family:var(--mono); font-size:54px; font-weight:600; line-height:1; color:var(--g); text-shadow:0 0 18px rgba(0,255,156,.6); }
  #count small { font-size:18px; color:var(--dim); }
  #handline { font-size:12px; color:var(--txt); background:rgba(0,0,0,.55); padding:4px 10px; border-radius:99px; }

  /* شاشة البداية */
  #splash { position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
            padding:24px; text-align:center; background:radial-gradient(circle at 50% 40%, rgba(0,255,156,.10), rgba(2,7,5,.96) 70%); }
  #splash h1 { font-size:24px; font-weight:700; color:var(--g); text-shadow:0 0 16px rgba(0,255,156,.5); }
  #splash p { font-size:14px; color:var(--dim); line-height:1.8; }
  #splash ol { list-style:none; display:grid; gap:8px; font-size:14px; text-align:right; }
  #splash li { display:flex; gap:10px; align-items:center; }
  #splash li span { flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-family:var(--mono); font-size:12px;
                    border:1px solid var(--line2); color:var(--g); }
  #start { font:600 17px var(--ar); color:#00140c; background:var(--g); border:0; border-radius:14px; padding:14px 34px;
           box-shadow:0 0 28px rgba(0,255,156,.45); }
  #start:active { transform:scale(.97); }
  #start:disabled { opacity:.7; }
  #err { font-size:13px; color:var(--red); min-height:1em; }

  /* اللمبات */
  #leds { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; padding:12px 8px 10px; border-radius:16px; background:var(--panel); border:1px solid var(--line); }
  .led { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .led .bulb { width:34px; height:34px; border-radius:50% 50% 45% 45%; border:2px solid var(--c); opacity:.28; transition:all .12s;
               background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), transparent 45%), color-mix(in srgb, var(--c) 25%, transparent); }
  .led.on .bulb { opacity:1; background:radial-gradient(circle at 35% 30%, #fff, var(--c) 55%);
                  box-shadow:0 0 14px var(--c), 0 0 30px color-mix(in srgb, var(--c) 60%, transparent); }
  .led .name { font-size:12px; font-weight:500; }
  .led .pin { font-size:10px; color:var(--dim); }

  /* الأوضاع */
  .seg { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; }
  .chip { font:500 12px var(--ar); padding:8px 2px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--dim); }
  .chip.on { background:var(--g); color:#00140c; border-color:var(--g); box-shadow:0 0 12px rgba(0,255,156,.35); }
  #fxbar { display:none; flex-direction:column; gap:8px; padding:10px; border-radius:14px; background:var(--panel); border:1px solid var(--line); }
  #fxbar.show { display:flex; }
  #fxbar .chip.on { background:transparent; color:var(--g); border-color:var(--g); }
  .speed { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--dim); }
  .speed input { flex:1; accent-color:var(--g); }
  #fxs { grid-template-columns:repeat(4,1fr); }
  #bright { grid-column:1/-1; display:flex; align-items:center; gap:10px; margin-top:8px; font-size:12px; color:var(--dim); }
  #bright input { flex:1; accent-color:var(--g); }
  #bright .mono { width:34px; text-align:center; color:var(--txt); }
  #bright.locked { opacity:.45; }
  #fwnote { grid-column:1/-1; text-align:center; font-size:11px; color:var(--amber); margin-top:4px; }
  #hint { grid-column:1/-1; text-align:center; font-size:12px; color:var(--dim); margin-bottom:4px; }
  #leds.manual .led { cursor:pointer; }
  #leds.manual .bulb { opacity:.55; }
  #leds.manual .led.on .bulb { opacity:1; }

  /* السجل */
  #term { border-radius:14px; background:rgba(0,0,0,.72); border:1px solid var(--line); overflow:hidden; }
  #term .bar { display:flex; justify-content:space-between; align-items:center; padding:6px 10px; font-size:11px; color:var(--dim); border-bottom:1px solid var(--line); }
  #term .bar span:first-child::before { content:"▍"; color:var(--g); animation:blink 1s steps(1) infinite; margin-left:4px; }
  #log { height:62px; overflow:hidden; padding:6px 10px; font-family:var(--mono); font-size:10.5px; line-height:1.55;
         display:flex; flex-direction:column; justify-content:flex-end; transition:height .2s; }
  #term.big #log { height:180px; }
  #log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; unicode-bidi:plaintext; text-align:right; color:var(--g2); }
  #log .hi { color:var(--txt); } #log .bad { color:var(--red); } #log .dim { color:var(--dim); }

  /* الأزرار */
  nav { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  nav button { font:500 13px var(--ar); color:var(--txt); background:var(--panel); border:1px solid var(--line2); border-radius:12px; padding:11px 4px;
               display:flex; align-items:center; justify-content:center; gap:6px; }
  nav button:active { background:var(--g); color:#00140c; }
  nav svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  @keyframes pulse { 50% { opacity:.35; } }
  @keyframes blink { 50% { opacity:0; } }
  @keyframes sweep { to { top:100%; } }
  @media (max-height:700px) { #count { font-size:40px; } .led .bulb { width:28px; height:28px; } #log { height:44px; } }
</style>
</head>
<body>
<canvas id="rain"></canvas>

<header>
  <div class="brand"><i></i>نظام تتبع اليد</div>
  <div class="pills">
    <div class="pill wait" id="p-link"><b></b>الخادم</div>
    <div class="pill" id="p-model"><b></b>الذكاء</div>
    <div class="pill" id="p-cam"><b></b>الكاميرا</div>
    <button class="pill" id="p-usb" title="اتصال بالكيبل"><b></b>USB</button>
  </div>
</header>

<section id="cam" class="mirror">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div class="scan"></div><div class="sweep"></div>
  <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
  <div class="hud-top"><span id="lock">◉ تم رصد الهدف</span><span id="fps" class="mono">-- FPS</span></div>
  <div class="hud-bottom"><span id="handline">بانتظار التشغيل</span><span id="count">0<small>/5</small></span></div>

  <div id="splash">
    <h1>نظام تتبع اليد</h1>
    <p>تحكم بلمبات الـ ESP32 بأصابعك عن طريق الواي فاي</p>
    <ol>
      <li><span>1</span>اضغط «ابدأ» واسمح للكاميرا</li>
      <li><span>2</span>وجّه كف يدك للكاميرا</li>
      <li><span>3</span>ارفع أصابعك وشوف اللمبات تشتغل</li>
    </ol>
    <button id="start">ابدأ التشغيل</button>
    <div id="err"></div>
  </div>
</section>

<section id="leds"></section>

<section class="seg" id="modes">
  <button class="chip on" data-mode="track">✋ تتبع</button>
  <button class="chip" data-mode="count">🔢 عدّاد</button>
  <button class="chip" data-mode="invert">🔄 عكسي</button>
  <button class="chip" data-mode="manual">👆 يدوي</button>
  <button class="chip" data-mode="fx">✨ تأثيرات</button>
</section>

<section id="fxbar">
  <div class="seg" id="fxs">
    <button class="chip on" data-fx="chase">مطاردة</button>
    <button class="chip" data-fx="bounce">ذهاب وإياب</button>
    <button class="chip" data-fx="blink">وميض</button>
    <button class="chip" data-fx="random">عشوائي</button>
    <button class="chip" data-fx="fill">تعبئة</button>
    <button class="chip" data-fx="breath" data-pwm>تنفّس</button>
    <button class="chip" data-fx="wave" data-pwm>موجة</button>
    <button class="chip" data-fx="sparkle" data-pwm>نجوم</button>
  </div>
  <label class="speed">🐢<input type="range" id="speed" min="1" max="10" value="5">🐇</label>
</section>

<section id="term">
  <div class="bar"><span>سجل النظام</span><span id="tx" class="mono">TX 0</span></div>
  <div id="log"></div>
</section>

<nav>
  <button id="flip"><svg viewBox="0 0 24 24"><path d="M3 7h13l-3-3M21 17H8l3 3"/></svg>قلب الكاميرا</button>
  <button id="test"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"/></svg>اختبار اللمبات</button>
  <button id="logbtn"><svg viewBox="0 0 24 24"><path d="M4 17l6-5-6-5M12 19h8"/></svg>السجل</button>
</nav>

<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<script type="module">
import { FilesetResolver, HandLandmarker }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// لازم يكون نفس الموضوع اللي في كود الـ ESP32
const TOPIC = "handleds/583369c8a8bd/fingers";
const BROKER = "wss://broker.hivemq.com:8884/mqtt";
const STATUS_TOPIC = "handleds/583369c8a8bd/status";  // الـ ESP32 يكتب فيه نسخته
// نفس ترتيب وألوان اللمبات على البريدبورد
const LEDS = [
  { name: "إبهام", pin: 23, c: "#ff4040" },  // أحمر
  { name: "سبابة", pin: 22, c: "#ffd400" },  // أصفر
  { name: "وسطى", pin: 21, c: "#3aa0ff" },  // أزرق
  { name: "بنصر", pin: 19, c: "#2bff6b" },  // أخضر
  { name: "خنصر", pin: 18, c: "#3aa0ff" },  // أزرق
];
const LINKS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

const $ = (id) => document.getElementById(id);
const video = $("video"), overlay = $("overlay"), ctx = overlay.getContext("2d");
let facing = "user", stream = null, landmarker = null, client = null;
let lastState = "", lastSent = 0, frames = 0, fpsT = performance.now(), running = false, lmIdx = 0, txCount = 0;

// ---------- واجهة ----------
const logEl = $("log");
function log(msg, cls = "") {
  const t = new Date().toTimeString().slice(0, 8);
  const d = document.createElement("div");
  d.textContent = `${t}  ${msg}`;
  if (cls) d.className = cls;
  logEl.appendChild(d);
  while (logEl.children.length > 60) logEl.firstChild.remove();
}
function pill(id, state) { $(id).className = "pill " + state; }

$("leds").innerHTML = `<div id="hint"></div>` + LEDS.map((l, i) =>
  `<div class="led" id="led${i}" data-i="${i}" style="--c:${l.c}"><div class="bulb"></div><div class="name">${l.name}</div><div class="pin mono">GPIO ${l.pin}</div></div>`
).join("") + `<label id="bright" class="locked">☀️ السطوع<input type="range" id="level" min="5" max="255" value="255" disabled><span class="mono" id="lvl">100%</span></label>
<div id="fwnote">⏳ التحكم بالسطوع يحتاج تحديث الـ ESP32</div>`;

let fw = 1;          // نسخة كود الـ ESP32 (تجي من الـ ESP32 نفسه)
let level = 255;     // السطوع العام
try { level = Number(localStorage.getItem("level")) || 255; } catch {}
$("level").value = level;

function paintBulb(i, v) {  // v من 0 إلى 255
  const el = $("led" + i), b = el.querySelector(".bulb");
  el.classList.toggle("on", v > 0);
  b.style.opacity = v > 0 ? (0.35 + 0.65 * v / 255).toFixed(2) : "";
  b.style.filter = v > 0 ? `brightness(${(0.55 + 0.45 * v / 255).toFixed(2)})` : "";
}
function showState(s) {
  if (s[0] === "P") return showLevels(s.slice(1).split(",").map(Number));
  let n = 0;
  for (let i = 0; i < 5; i++) { const on = s[i] === "1"; n += on; paintBulb(i, on ? (fw >= 2 ? level : 255) : 0); }
  $("count").firstChild.nodeValue = n;
}
function showLevels(v) {
  let n = 0;
  v.forEach((x, i) => { paintBulb(i, x); n += x > 0; });
  $("count").firstChild.nodeValue = n;
}
showState("00000");

// مطر الأكواد بالخلفية
const rain = $("rain"), rc = rain.getContext("2d");
let drops = [];
function sizeRain() {
  rain.width = innerWidth; rain.height = innerHeight;
  drops = Array(Math.ceil(innerWidth / 16)).fill(0).map(() => Math.random() * -innerHeight / 16);
}
sizeRain(); addEventListener("resize", sizeRain);
const CH = "01アイウエオカキクケコ<>/{}#$%&*+=";
setInterval(() => {
  rc.fillStyle = "rgba(2,7,5,.14)"; rc.fillRect(0, 0, rain.width, rain.height);
  rc.fillStyle = "#00ff9c"; rc.font = "14px monospace";
  drops.forEach((y, i) => {
    rc.fillText(CH[Math.random() * CH.length | 0], i * 16, y * 16);
    drops[i] = y * 16 > rain.height && Math.random() > 0.97 ? 0 : y + 1;
  });
}, 70);

log("بدء تشغيل النظام...", "hi");

// ---------- الاتصال (MQTT) ----------
function connectMqtt() {
  if (!window.mqtt) { pill("p-link", "bad"); log("فشل تحميل مكتبة الاتصال", "bad"); return; }
  client = mqtt.connect(BROKER, {
    clientId: "iphone-" + Math.random().toString(16).slice(2, 10),
    keepalive: 30, reconnectPeriod: 2000, connectTimeout: 8000, clean: true,
  });
  client.on("connect", () => { pill("p-link", "ok"); log("تم الاتصال بالخادم ✓", "hi"); lastSent = 0; client.subscribe(STATUS_TOPIC); });
  client.on("message", (t, m) => {
    if (t !== STATUS_TOPIC) return;
    try { const st = JSON.parse(m.toString()); setFw(st.fw || 1, st.ip); } catch {}
  });
  client.on("reconnect", () => pill("p-link", "wait"));
  client.on("offline", () => { pill("p-link", "bad"); log("انقطع الاتصال، جاري إعادة المحاولة...", "bad"); });
  client.on("error", (e) => log("خطأ في الاتصال " + (e && e.message || ""), "bad"));
}
function send(s, quiet) {
  const mq = client && client.connected;
  if (!mq && !writer) return;
  if (mq) client.publish(TOPIC, s, { qos: 0 });
  writeSerial(s);
  lastSent = performance.now();
  $("tx").textContent = "TX " + (++txCount);
  if (!quiet) {
    const hex = [...(s + "\n")].map((c) => c.charCodeAt(0).toString(16).toUpperCase().padStart(2, "0")).join(" ");
    log(`إرسال ← ESP32  ${hex}`, "hi");
  }
}

// ---------- الكاميرا ----------
async function startCamera() {
  pill("p-cam", "wait");
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false,
  });
  video.srcObject = stream;
  await video.play();
  $("cam").classList.toggle("mirror", facing === "user");
  pill("p-cam", "ok");
  log(`الكاميرا ${facing === "user" ? "الأمامية" : "الخلفية"} شغالة ✓`, "hi");
}

// ---------- منطق الأصابع ----------
function fingers(lm, w = 1, h = 1) {
  // طريقة ما تتأثر باتجاه الكاميرا ولا يمين/يسار ولا ميلان اليد
  const d = (a, b) => Math.hypot((lm[a].x - lm[b].x) * w, (lm[a].y - lm[b].y) * h);
  // الإبهام: مرفوع لما رأسه يبعد عن قاعدة الخنصر أكثر من مفصله الأول بوضوح
  const thumb = d(4, 17) > d(2, 17) * 1.05;
  const s = [thumb ? 1 : 0];
  // باقي الأصابع: مرفوع لما رأسه أبعد عن الرسغ من مفصله الأوسط
  for (const tip of [8, 12, 16, 20]) s.push(d(tip, 0) > d(tip - 2, 0) * 1.1 ? 1 : 0);
  return s.join("");
}

function draw(lm, state) {
  const w = overlay.width, h = overlay.height;
  ctx.clearRect(0, 0, w, h);
  $("lock").classList.toggle("on", !!lm);
  if (!lm) return;
  ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(0,255,156,.55)"; ctx.lineWidth = 3;
  for (const [a, b] of LINKS) {
    ctx.beginPath(); ctx.moveTo(lm[a].x * w, lm[a].y * h); ctx.lineTo(lm[b].x * w, lm[b].y * h); ctx.stroke();
  }
  lm.forEach((p, i) => {
    ctx.beginPath(); ctx.arc(p.x * w, p.y * h, i % 4 === 0 && i ? 6 : 3.5, 0, 7);
    ctx.fillStyle = i % 4 === 0 && i ? (state[i / 4 - 1] === "1" ? LEDS[i / 4 - 1].c : "#1d4434") : "#00ff9c";
    ctx.fill();
  });
  const xs = lm.map((p) => p.x * w), ys = lm.map((p) => p.y * h);
  const x0 = Math.min(...xs) - 22, y0 = Math.min(...ys) - 22, x1 = Math.max(...xs) + 22, y1 = Math.max(...ys) + 22, L = 22;
  ctx.strokeStyle = "#00ff9c"; ctx.lineWidth = 3;
  for (const [cx, cy, dx, dy] of [[x0,y0,1,1],[x1,y0,-1,1],[x0,y1,1,-1],[x1,y1,-1,-1]]) {
    ctx.beginPath(); ctx.moveTo(cx + dx * L, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy + dy * L); ctx.stroke();
  }
}

function loop() {
  if (!running) return;
  if (video.readyState >= 2) {
    if (overlay.width !== video.videoWidth) { overlay.width = video.videoWidth; overlay.height = video.videoHeight; }
    const r = landmarker.detectForVideo(video, performance.now());
    let state = "00000", lm = null;
    if (r.landmarks && r.landmarks.length) {
      lm = r.landmarks[0];
      const h = r.handedness[0][0];
      state = fingers(lm, video.videoWidth, video.videoHeight);
      $("handline").innerHTML = `يد ${h.categoryName === "Left" ? "يمين" : "يسار"} · <span class="mono">${Math.round(h.score * 100)}%</span>`;
      if (frames % 3 === 0) {
        const p = lm[lmIdx];
        log(`نقطة[${String(lmIdx).padStart(2, "0")}]  x=${p.x.toFixed(3)} y=${p.y.toFixed(3)} z=${p.z.toFixed(3)}`, "dim");
        lmIdx = (lmIdx + 1) % 21;
      }
    } else {
      $("handline").textContent = "جاري البحث عن اليد" + ".".repeat((frames >> 3) % 4);
    }
    draw(lm, state);
    const out = fromFingers(state);  // حسب الوضع المختار (تتبع / عدّاد / عكسي)
    if (out !== null) {
      if (out !== lastState) { lastState = out; showState(out); send(out); }
      else if (performance.now() - lastSent > 2000) send(out, true);  // تذكير كل ثانيتين
    }
    frames++;
    const now = performance.now();
    if (now - fpsT > 1000) { $("fps").textContent = `${Math.round(frames * 1000 / (now - fpsT))} FPS`; frames = 0; fpsT = now; }
  }
  requestAnimationFrame(loop);
}

async function loadModel() {
  pill("p-model", "wait");
  log("جاري تحميل نموذج الذكاء الاصطناعي...");
  const files = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = (delegate) => ({
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate,
    },
    runningMode: "VIDEO", numHands: 1,
    minHandDetectionConfidence: 0.6, minHandPresenceConfidence: 0.6, minTrackingConfidence: 0.5,
  });
  try { landmarker = await HandLandmarker.createFromOptions(files, opts("GPU")); }
  catch { landmarker = await HandLandmarker.createFromOptions(files, opts("CPU")); }
  pill("p-model", "ok");
  log("نموذج الذكاء الاصطناعي جاهز ✓", "hi");
}

let wakeLock = null;
async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && running) keepAwake();
});

$("start").onclick = async () => {
  const b = $("start");
  b.disabled = true; b.textContent = "جاري التحميل..."; $("err").textContent = "";
  try {
    await Promise.all([startCamera(), landmarker ? null : loadModel()]);
    $("splash").remove();
    keepAwake();
    running = true;
    log("النظام شغال ✓ ارفع يدك", "hi");
    requestAnimationFrame(loop);
  } catch (e) {
    b.disabled = false; b.textContent = "حاول مرة ثانية";
    if (!stream) pill("p-cam", "bad");
    const msg = e && e.name === "NotAllowedError"
      ? "ما سمحت للكاميرا. روح الإعدادات ← Safari ← الكاميرا ← اسمح"
      : "صار خطأ: " + (e && (e.message || e.name));
    $("err").textContent = msg; log(msg, "bad");
  }
};
$("flip").onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  if (!running) return log(`بتستخدم الكاميرا ${facing === "user" ? "الأمامية" : "الخلفية"}`);
  try { await startCamera(); } catch (e) { pill("p-cam", "bad"); log("خطأ في الكاميرا " + e.message, "bad"); }
};
// ---------- الأوضاع ----------
let mode = "track", fx = "chase", fxTimer = null, fxStep = 0, manual = "00000", testing = false;
const HINTS = {
  track: "كل إصبع يشغّل لمبته",
  count: "عدد أصابعك المرفوعة = عدد اللمبات",
  invert: "الإصبع المرفوع يطفي لمبته",
  manual: "اضغط على أي لمبة عشان تشغلها أو تطفيها",
  fx: "تأثيرات ضوئية تشتغل بدون يد",
};
const NAMES_AR = { track: "تتبع", count: "عدّاد", invert: "عكسي", manual: "يدوي", fx: "تأثيرات" };
const FX_AR = { chase: "مطاردة", bounce: "ذهاب وإياب", blink: "وميض", random: "عشوائي", fill: "تعبئة" };

function fromFingers(s) {
  if (testing) return null;
  if (mode === "track") return s;
  if (mode === "invert") return [...s].map((c) => (c === "1" ? "0" : "1")).join("");
  if (mode === "count") { const n = [...s].filter((c) => c === "1").length; return "1".repeat(n) + "0".repeat(5 - n); }
  return null;  // يدوي وتأثيرات ما يعتمدون على اليد
}
const oneHot = (i) => "00000".slice(0, i) + "1" + "00000".slice(i + 1);
function fxFrame(k) {
  if (fx === "chase") return oneHot(k % 5);
  if (fx === "bounce") { const p = k % 8; return oneHot(p < 5 ? p : 8 - p); }
  if (fx === "blink") return k % 2 ? "11111" : "00000";
  if (fx === "fill") { const n = k % 6; return "1".repeat(n) + "0".repeat(5 - n); }
  let r; do { r = Array.from({ length: 5 }, () => (Math.random() < 0.45 ? "1" : "0")).join(""); } while (r === lastState);
  return r;
}
const PWM_FX = ["breath", "wave", "sparkle"];
let phase = 0, sparks = [0, 0, 0, 0, 0];
function pwmFrame() {
  const sp = Number($("speed").value);
  phase += 0.03 + sp * 0.025;
  let v;
  if (fx === "breath") { const b = (1 - Math.cos(phase)) / 2; v = [0, 0, 0, 0, 0].map(() => b); }
  else if (fx === "wave") v = [0, 1, 2, 3, 4].map((i) => Math.max(0, Math.sin(phase - i * 0.9)));
  else { sparks = sparks.map((x) => x * (0.86 - sp * 0.02)); if (Math.random() < 0.25 + sp * 0.04) sparks[Math.random() * 5 | 0] = 1; v = sparks; }
  return "P" + v.map((x) => Math.round(x * level)).join(",");
}
const fxDelay = () => PWM_FX.includes(fx) ? 90 : 650 - Number($("speed").value) * 55;  // 600ms .. 100ms
function fxTick() {
  const s = PWM_FX.includes(fx) ? pwmFrame() : fxFrame(fxStep++);
  lastState = s; showState(s); send(s, true);
  fxTimer = setTimeout(fxTick, fxDelay());
}
function output(s) { lastState = s; showState(s); send(s); }

function setMode(m) {
  mode = m;
  clearTimeout(fxTimer); fxTimer = null;
  document.querySelectorAll("#modes .chip").forEach((b) => b.classList.toggle("on", b.dataset.mode === m));
  $("fxbar").classList.toggle("show", m === "fx");
  $("leds").classList.toggle("manual", m === "manual");
  $("hint").textContent = HINTS[m];
  lastState = "";
  if (m === "manual") output(manual);
  else if (m === "fx") { fxStep = 0; fxTick(); }
  else output("00000");
  log(`الوضع: ${NAMES_AR[m]}${m === "fx" ? " · " + FX_AR[fx] : ""}`, "hi");
}
document.querySelectorAll("#modes .chip").forEach((b) => (b.onclick = () => setMode(b.dataset.mode)));
document.querySelectorAll("#fxs .chip").forEach((b) => (b.onclick = () => {
  if (b.hasAttribute("data-pwm") && fw < 2) return log("هذا التأثير يحتاج تحديث الـ ESP32", "bad");
  fx = b.dataset.fx;
  document.querySelectorAll("#fxs .chip").forEach((x) => x.classList.toggle("on", x === b));
  if (mode === "fx") setMode("fx");
}));
document.querySelectorAll(".led").forEach((el) => (el.onclick = () => {
  if (mode !== "manual") return;
  const i = Number(el.dataset.i);
  manual = manual.slice(0, i) + (manual[i] === "1" ? "0" : "1") + manual.slice(i + 1);
  output(manual);
}));
// تذكير للـ ESP32 في الوضع اليدوي (لو رجع اتصل)
setInterval(() => { if (mode === "manual" && !testing && performance.now() - lastSent > 2000) send(manual, true); }, 1000);

$("test").onclick = async () => {
  if (!(client && client.connected) && !writer) return log("مو متصل بالـ ESP32 للحين", "bad");
  if (testing) return;
  log("جاري اختبار اللمبات...", "hi");
  testing = true; clearTimeout(fxTimer);
  for (let r = 0; r < 2; r++) for (let i = 0; i < 5; i++) {
    send(oneHot(i), true); showState(oneHot(i));
    await new Promise((ok) => setTimeout(ok, 150));
  }
  send("11111"); showState("11111"); await new Promise((ok) => setTimeout(ok, 600));
  testing = false;
  setMode(mode);
};
$("logbtn").onclick = () => $("term").classList.toggle("big");

// ---------- اتصال USB (من Chrome على الكمبيوتر) ----------
let port = null, writer = null;
const enc = new TextEncoder();
const NL = String.fromCharCode(10);
function writeSerial(s) { if (writer) writer.write(enc.encode(s + NL)).catch(() => {}); }
async function readLoop(p) {
  const dec = new TextDecoderStream();
  p.readable.pipeTo(dec.writable).catch(() => {});
  const reader = dec.readable.getReader();
  let buf = "";
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf(NL)) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (line.startsWith("STATUS ")) { try { const st = JSON.parse(line.slice(7)); setFw(st.fw || 1, st.ip); } catch {} }
      }
    }
  } catch {}
}
async function openPort(p) {
  await p.open({ baudRate: 9600 });
  // بدونها الـ ESP32 ممكن يعيد التشغيل لما ينفتح المنفذ
  try { await p.setSignals({ dataTerminalReady: false, requestToSend: false }); } catch {}
  port = p; writer = p.writable.getWriter();
  pill("p-usb", "ok");
  log("تم الاتصال بالـ ESP32 عبر USB ✓", "hi");
  readLoop(p);
  setTimeout(() => writeSerial("?"), 400);
  if (lastState) setTimeout(() => writeSerial(lastState), 500);
}
async function connectUSB() {
  if (port) return log("USB متصل أصلاً");
  try {
    const p = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x1a86 }, { usbVendorId: 0x10c4 }, { usbVendorId: 0x303a }] });
    await openPort(p);
  } catch (e) {
    if (e.name === "NotFoundError") return;  // سكّر نافذة الاختيار
    pill("p-usb", "bad");
    log(e.name === "InvalidStateError" || /open/i.test(e.message) ? "المنفذ مشغول: سكّر أي برنامج ثاني يستخدم الـ ESP32" : "خطأ USB: " + e.message, "bad");
  }
}
if ("serial" in navigator) {
  $("p-usb").onclick = connectUSB;
  navigator.serial.addEventListener("disconnect", (e) => {
    if (e.target === port) { port = null; writer = null; pill("p-usb", ""); log("انفصل كيبل USB", "bad"); }
  });
  navigator.serial.getPorts().then((ps) => { if (ps[0]) openPort(ps[0]).catch(() => {}); });  // يرجع يتصل لحاله
} else {
  $("p-usb").style.display = "none";  // الآيفون ما يدعم USB في المتصفح
}

// ---------- السطوع ----------
function setFw(v, ip) {
  const was = fw; fw = v;
  const ok = fw >= 2;
  $("bright").classList.toggle("locked", !ok); $("level").disabled = !ok;
  $("fwnote").style.display = ok ? "none" : "";
  document.querySelectorAll("#fxs [data-pwm]").forEach((b) => (b.style.opacity = ok ? "" : ".4"));
  if (ok && was !== v) { log(`الـ ESP32 نسخة ${fw}${ip ? " · " + ip : ""} ✓ السطوع متاح`, "hi"); sendLevel(true); }
}
let levelTimer = null;
function sendLevel(now) {
  clearTimeout(levelTimer);
  levelTimer = setTimeout(() => {
    if (client && client.connected) client.publish(TOPIC, "L" + level);
    writeSerial("L" + level);
  }, now ? 0 : 120);
}
$("level").oninput = () => {
  level = Number($("level").value);
  $("lvl").textContent = Math.round(level / 255 * 100) + "%";
  try { localStorage.setItem("level", level); } catch {}
  if (lastState && lastState[0] !== "P") showState(lastState);
  sendLevel();
};
$("lvl").textContent = Math.round(level / 255 * 100) + "%";
setFw(1);

connectMqtt();
$("hint").textContent = HINTS.track;
window.__debug = { get usb() { return !!writer; }, send, fingers, showState, setMode, fromFingers, setFw, get level() { return level; }, get mode() { return mode; }, get last() { return lastState; }, get landmarker() { return landmarker; }, loadModel, get client() { return client; } };
</script>
</body>
